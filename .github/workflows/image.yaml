name: Build container image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jodok/batlogg.com
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy production through Namche infra
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions: {}
    env:
      IMAGE: ghcr.io/jodok/batlogg.com
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - name: Dispatch immutable image to Namche infra
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Buildx returned a malformed image digest: $DIGEST"
            exit 1
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::INFRA_DISPATCH_TOKEN is empty; refusing to report an undeployed release"
            exit 1
          fi

          gh workflow run deploy-app.yml -R NamcheAI/infra --ref main \
            -f app=batlogg-site \
            -f environment=production \
            -f image="$IMAGE@$DIGEST"
          echo "::notice::Dispatched $IMAGE@$DIGEST to NamcheAI/infra"
